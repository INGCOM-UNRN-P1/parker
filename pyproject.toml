[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parker"
version = "0.1.0"
description = "Auditor de estabilidad de ABIs, visibilidad de símbolos y compatibilidad binaria en C"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
parker = "parker.cli:app"

[project.entry-points."ripley.plugins"]
abi_audit = "parker.plugins.ripley_plugin:ParkerPlugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
